# M15 CI 模板（Azure DevOps Pipelines）
# - 雲端農場（AWS Device Farm）伺服器端執行：本 job 只負責打包 → 上傳 → 排程 → 輪詢 → 下載結果 → 報表
# - 機密：Variable group（連 Key Vault）；AWS 用 service connection（AWS Toolkit for Azure DevOps）
# - 結果：PublishTestResults（JUnit）進 Azure Test Plans / Tests 分頁；report.html 當 artifact
trigger: none
pr: { branches: { include: [main] } }
schedules:
  - cron: "0 17 * * 1-5"
    displayName: nightly regression
    branches: { include: [main] }
    always: true

pool: { vmImage: ubuntu-latest }
variables:
  - group: mobile-qa-secrets       # TEST_USER_PW、OTP 相關、TESTPLAN_PAT…
  - name: SUITE
    value: $[ iif(eq(variables['Build.Reason'], 'PullRequest'), 'smoke', 'regression') ]
  - name: PYTHONIOENCODING
    value: utf-8

steps:
  - task: UsePythonVersion@0
    inputs: { versionSpec: "3.11" }
  - script: pip install -r requirements.txt
    displayName: deps
  - task: DownloadPipelineArtifact@2           # App 的 qa build（由 App pipeline 產出）
    inputs: { source: specific, artifact: app-qa-apk, path: $(Pipeline.Workspace)/app }
  - script: ./scripts/package_tests.sh          # 自行實作：Appium-Python → pip wheel 到 wheelhouse + tests/ + requirements → zip
    displayName: package tests
  - task: AWSShellScript@1
    displayName: run on AWS Device Farm
    inputs:
      awsCredentials: aws-devicefarm             # service connection
      regionName: us-west-2                      # Device Farm 只有特定區域；資料駐留要求時先確認
      scriptType: inline
      inlineScript: |
        set -e
        # 1. create-upload（APK / test package / test spec）→ 用回傳的 presigned URL PUT 上傳 → 等 status=SUCCEEDED
        # 2. schedule-run --device-pool-arn $(DEVICE_POOL_ARN) --test type=APPIUM_PYTHON,testPackageArn=...,testSpecArn=...
        #    （test spec YAML 內：安裝 wheelhouse → pytest -m "$SUITE" --junitxml=$DEVICEFARM_LOG_DIR/report.xml）
        # 3. 輪詢 get-run 直到 COMPLETED，上限 = job timeout（單次 run 也有平台時間上限）
        # 4. list-artifacts → 下載每台裝置的 report.xml / *.result.json / 截圖 → test-results/<ts>/<device>/
        python3 scripts/devicefarm_run.py --suite "$(SUITE)"   # 建議把上面四步寫成這支 Python（跨平台、好除錯）
  - script: python3 scripts/generate_report.py "$(ls -td test-results/*/ | head -1)"
    condition: always()
    displayName: report
  - task: PublishTestResults@2
    condition: always()
    inputs: { testResultsFormat: JUnit, testResultsFiles: "test-results/**/report.xml", testRunTitle: "UI $(SUITE)" }
  - publish: report.html
    artifact: ui-report
    condition: always()
