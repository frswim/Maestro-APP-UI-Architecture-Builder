# M15 CI 模板（Bitbucket Pipelines）
# 注意：Bitbucket Cloud 的雲端 runner 沒有 KVM → 不能跑 Android 模擬器。
#   - 實機 / 模擬器：用 self-hosted Linux shell runner（接辦公室的實機，或可開模擬器的機器）
#   - 雲端農場：在雲端 runner 上只做「打包 → 上傳 → 輪詢 → 下載結果」（先確認農場支援你選的工具，見 P5.5 相容表）
# 機密：Repository / Deployment variables（secured）；artifact 預設保留期有限 → 結果歷史（M20）要另存
# 單一 step 有時間上限（max-time），長回歸要分片
image: python:3.11
definitions:
  steps:
    - step: &ui-device
        name: UI on office devices
        runs-on: [self.hosted, linux.shell, mobile-lab]   # self-hosted runner 的 labels
        max-time: 90
        script:
          - pip3 install -r requirements.txt
          - export TIMEOUT_SCALE=${TIMEOUT_SCALE:-1.5}      # 低階機
          - ./scripts/run_suite.sh default flows/ -- --include-tags "$SUITE"
          - python3 scripts/trend_report.py --weeks 12 || true
          - NOTIFY_WEBHOOK_URL="$GCHAT_WEBHOOK" ./scripts/notify.sh $? "default/$SUITE" "$BITBUCKET_GIT_HTTP_ORIGIN/pipelines/results/$BITBUCKET_BUILD_NUMBER" || true
        artifacts:
          - report.html
          - test-results/**
          - history/**
pipelines:
  pull-requests:
    "**":
      - step: { <<: *ui-device, name: smoke, script: [ "export SUITE=smoke", "pip3 install -r requirements.txt", "./scripts/run_suite.sh default flows/ -- --include-tags smoke" ] }
  custom:
    nightly:                # 在 Bitbucket 的 Schedules 設定每天觸發
      - variables: [ { name: SUITE, default: regression } ]
      - step: *ui-device
