# M15 CI 模板（GitHub Actions）。兩種 job 擇一或並用：
#   A. local-emulator：Linux runner 跑 Android 模擬器（Maestro 本機模式，用 run_suite.sh）
#   B. cloud-farm：上傳到雲端裝置農場（iOS 實機 / 多裝置），結果下載回來後用同一套報表腳本
# 機密全部走 repository secrets；品牌設定檔在 job 內由 secrets 產生，不進版控。
# GitHub Enterprise Server（GHES，自架）注意：
#   - `runs-on` 改成 self-hosted labels（例如 [self-hosted, linux, kvm] / [self-hosted, macos]）
#   - marketplace actions 要經 GitHub Connect 同步或鏡像到內部 org；`actions/upload-artifact@v4` 在 GHES 不支援 → 用 v3 或改傳到內部儲存
#   - 同一台 Mac 只能一個 job 時用 `concurrency: { group: mac-mini-1 }`
name: ui-automation
on:
  pull_request:            # 冒煙當 merge gate（目標 < 15 分鐘）
    branches: [main]
  schedule:                # 夜間完整回歸
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  local-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45    # CI 層的 watchdog（runner 內還有 MAESTRO_TIMEOUT_MIN）
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - run: curl -Ls "https://get.maestro.mobile.dev" | bash
      - name: Write brand config from secrets
        run: |
          mkdir -p config/brands
          cat > config/brands/default.yaml <<EOF
          device_type: "android"
          app_id: "${{ vars.APP_ID }}"
          device: "emulator-5554"
          user_pw: "${{ secrets.TEST_USER_PW }}"
          EOF
      - name: Get app build          # 由 App 的 build pipeline 產出的測試包（保留 testID 的 debug/qa build）
        run: echo "download the test APK artifact here" # 例：gh run download / 內部 artifact 庫
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          MAESTRO_TIMEOUT_MIN: "40"
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          REPORT_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          api-level: 34
          script: |
            adb install -r app-under-test.apk
            TAGS=$([ "${{ github.event_name }}" = "pull_request" ] && echo smoke || echo regression)
            ./scripts/run_suite.sh default flows/ -- --include-tags "$TAGS"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-report
          path: |
            report.html
            test-results/
            .last_run_status.json

  ios-simulator:              # macOS self-hosted runner（GHES 常見）；GitHub 雲端可用 macos-latest
    runs-on: [self-hosted, macos]
    concurrency: { group: mac-runner }
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: pip3 install -r requirements.txt
      - run: |
          xcrun simctl boot "$IOS_SIM_UDID" || true
          xcrun simctl install "$IOS_SIM_UDID" "$APP_IOS_SIM_APP"
          PLATFORM=ios DEVICE="$IOS_SIM_UDID" ./scripts/run_suite.sh default flows/ -- --include-tags smoke
        env:
          IOS_SIM_UDID: ${{ vars.IOS_SIM_UDID }}
          APP_IOS_SIM_APP: build/App.app
      # 原生 XCUITest 路線：改成 xcodebuild test-without-building（tool-adaptation.md §4.7）

  # cloud-farm:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - checkout / python / 產生設定（同上）
  #     - 把 config/*/active 實體化（cp -R），打包 flows+subflows+config 成 zip
  #     - 呼叫裝置農場 API：上傳 App（.apk / 已簽章 .ipa）與測試包 → 觸發 build（指定裝置清單、並行數）
  #     - 輪詢狀態（設上限 = CI 層 watchdog）→ 下載每台裝置的 log / 截圖 / 結果檔
  #     - 轉成 test-results/<ts>/<flow>/logs/maestro.log 結構 → generate_report.py / _summarize_results.py / notify.sh
  #     - 以「農場回報狀態 + failure_rules 判定」決定 exit code
