# M15 CI 模板（GitLab CI，自架 runner）
# - macOS runner（iOS 模擬器 / 實機）用 tags 指定；只有一台時用 resource_group 序列化，避免搶裝置
# - Linux runner 跑 Android emulator 需要 KVM（privileged 或 /dev/kvm 掛進容器）
# - 機密：CI/CD variables（masked + protected）；資料駐留有要求時確認 runner 與 artifact 儲存的區域
stages: [smoke, regression]

variables:
  MAESTRO_TIMEOUT_MIN: "40"
  REPORT_LANG: "en"

.ui_job:
  before_script:
    # 內網 / 不得連外（Q-P5-3 b）：pip 與 Maestro CLI 改用內部鏡像或預先打包到 runner 映像，並設 MAESTRO_CLI_NO_ANALYTICS=1
    - pip3 install -r requirements.txt
    - curl -Ls "https://get.maestro.mobile.dev" | bash
    - export PATH="$HOME/.maestro/bin:$PATH"
    - |
      mkdir -p config/brands
      printf 'device_type: "%s"\napp_id: "%s"\n' "$PLATFORM" "$APP_ID" > config/brands/default.yaml
  artifacts:
    when: always
    expire_in: 30 days
    paths: [report.html, report_rerun.html, test-results/, .last_run_status.json]
    reports:
      junit: test-results/junit-*.xml       # runner 加 -- --format junit --output test-results/junit-$CI_JOB_ID.xml 時

smoke:android:
  extends: .ui_job
  stage: smoke
  tags: [linux, kvm]
  rules: [{ if: '$CI_PIPELINE_SOURCE == "merge_request_event"' }]
  variables: { PLATFORM: "android" }
  script:
    - ./scripts/start_emulator.sh            # 自行實作：sdkmanager 安裝 system image → avdmanager 建 AVD → emulator -no-window → 等 boot 完成
    - adb install -r "$APP_APK"
    - ./scripts/run_suite.sh default flows/ -- --include-tags smoke

regression:ios:
  extends: .ui_job
  stage: regression
  tags: [macos]
  resource_group: macos-simulators          # 唯一一台 mac：同時只跑一個 job
  rules: [{ if: '$CI_PIPELINE_SOURCE == "schedule"' }]
  parallel:
    matrix:
      - LOCALE: ["<locale_1>", "<locale_2>"]   # 依 Q-P2-3 的語系；不分語系就刪掉 parallel
  variables: { PLATFORM: "ios" }
  script:
    - xcrun simctl boot "$IOS_SIM_UDID" || true
    - xcrun simctl install "$IOS_SIM_UDID" "$APP_IOS_SIM_APP"
    - DEVICE="$IOS_SIM_UDID" ./scripts/run_suite.sh default flows/ -- --include-tags regression
  after_script:
    - python3 scripts/push_testrail.py || true   # 選配：回寫 TestRail

# 自有實機 lab：Mac mini 上的 shell executor 接 USB 實機（Android + iPhone）
# 每台實機一個 resource_group（同一台同時只跑一個 job）；受測硬體（IoT 裝置等）也用 resource_group 鎖
device-lab:android-1:
  extends: .ui_job
  stage: regression
  tags: [macos, shell, device-lab]
  resource_group: device-android-1
  rules: [{ if: '$CI_PIPELINE_SOURCE == "schedule"' }]
  variables: { PLATFORM: "android", DEVICE: "<adb_serial>" }
  script:
    - adb -s "$DEVICE" get-state
    - ./scripts/run_suite.sh default flows/ -- --include-tags regression
