appId: ${app_id}
---
# 清除流程中的阻擋型彈窗（任何階段都可呼叫）
# 清單來源：output.selector.common_page.popup.blocking_dismiss_ids / blocking_dismiss_by_title
#   → 前端加新彈窗時只改 selector 設定，不用改 flow
#
# 結果：output.popupDismissed = true 代表這次至少關掉一個彈窗
#       （呼叫端用來判斷「原本的點擊可能被彈窗吃掉，要不要重點」）
#
# 耗時：沒有彈窗時，每個清單只做一次 visible 判斷。
#   注意：Maestro 的 visible 判斷最多會等「7 秒 - 距上次點擊經過的時間」，
#   所以盡量在頁面已載入一段時間後才呼叫（例如等完錨點 + 動畫之後）。
# Selectors 在主 flow 中加載

- evalScript: ${output.popupDismissed = false}
- evalScript: "${output.popupIdRegex = (output.selector.common_page.popup.blocking_dismiss_ids || []).join('|')}"
- evalScript: "${output.popupTitleRegex = (output.selector.common_page.popup.blocking_dismiss_by_title || []).map(function (p) { return p.title }).join('|')}"
- evalScript: "${output.popupButtonRegex = (output.selector.common_page.popup.blocking_dismiss_by_title || []).map(function (p) { return p.button }).join('|')}"

# --- id 類（一次 regex 判斷涵蓋所有已知彈窗）---
- runFlow:
    when:
      true: ${output.popupIdRegex != ''}
    commands:
      - runFlow:
          when:
            visible:
              id: ${output.popupIdRegex}
          commands:
            # 彈窗疊彈窗時連續關，最多 3 個
            - repeat:
                times: 3
                while:
                  visible:
                    id: ${output.popupIdRegex}
                commands:
                  - tapOn:
                      id: ${output.popupIdRegex}
                      retryTapIfNoChange: false
                  - evalScript: ${output.popupDismissed = true}
                  - waitForAnimationToEnd:
                      timeout: 1500

# --- 標題 + 按鈕類（WebView 彈窗常沒有 id；按鈕必須在已知標題「下方」才點，清單為空時完全不檢查）---
- runFlow:
    when:
      true: ${output.popupTitleRegex != ''}
    commands:
      - runFlow:
          when:
            visible:
              text: ${output.popupButtonRegex}
              below:
                text: ${output.popupTitleRegex}
          commands:
            - repeat:
                times: 3
                while:
                  visible:
                    text: ${output.popupButtonRegex}
                    below:
                      text: ${output.popupTitleRegex}
                commands:
                  - tapOn:
                      text: ${output.popupButtonRegex}
                      below:
                        text: ${output.popupTitleRegex}
                      retryTapIfNoChange: false
                  - evalScript: ${output.popupDismissed = true}
                  - waitForAnimationToEnd:
                      timeout: 1500
