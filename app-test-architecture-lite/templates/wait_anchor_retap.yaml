appId: ${app_id}
---
# wait_anchor_or_dismiss.yaml 內部用：錨點等不到時的處理
#   1. 有 confirm_text 且在畫面上 → 點它（流程本來就要點的確認，點完不重點原按鈕）
#   2. 否則清阻擋型彈窗；確實關掉彈窗才重點（text / id / point 有給哪個就點哪個）
- evalScript: ${output.waConfirmed = false}
- evalScript: ${output.popupDismissed = false}

- runFlow:
    when:
      true: ${output.waConfirm != ''}
    commands:
      - runFlow:
          when:
            visible:
              text: ${output.waConfirm}
          commands:
            - tapOn:
                text: ${output.waConfirm}
                retryTapIfNoChange: false
            - evalScript: ${output.waConfirmed = true}
            - waitForAnimationToEnd:
                timeout: 1500

- runFlow:
    when:
      true: ${!output.waConfirmed}
    commands:
      - runFlow: dismiss_blocking_popups.yaml
      - runFlow:
          when:
            true: "${output.popupDismissed && output.waRetap != ''}"
          commands:
            - tapOn:
                text: ${output.waRetap}
                retryTapIfNoChange: false
                optional: true
      - runFlow:
          when:
            true: "${output.popupDismissed && output.waRetapId != ''}"
          commands:
            - tapOn:
                id: ${output.waRetapId}
                index: ${output.waRetapIndex}
                retryTapIfNoChange: false
                optional: true
      - runFlow:
          when:
            true: "${output.popupDismissed && output.waRetapPoint != ''}"
          commands:
            - tapOn:
                point: ${output.waRetapPoint}
                retryTapIfNoChange: false
